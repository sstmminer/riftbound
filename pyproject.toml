[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftbound-sim"
version = "0.3.0"
description = "Deterministic Riftbound Origins subset simulator with self-play and replay validation"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
riftbound-sim = "riftbound.cli:main"

[tool.setuptools.packages.find]
include = ["riftbound*"]

[tool.setuptools.package-data]
riftbound = ["data/*.json", "data/images/*.png", "data/images/OGN/*.png"]
