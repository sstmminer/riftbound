<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">骑自行车的鹈鹕</title>
  <desc id="desc">一只戴着蓝色头盔的鹈鹕，迎着晨光骑在红色自行车上。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde8ff"/>
      <stop offset="0.7" stop-color="#eaf8ff"/>
      <stop offset="1" stop-color="#fff4d8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#405064"/>
      <stop offset="1" stop-color="#253244"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#d9e3e8"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd873"/>
      <stop offset="1" stop-color="#e89b3a"/>
    </linearGradient>
    <linearGradient id="bike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6e68"/>
      <stop offset="1" stop-color="#bc2f49"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="950" cy="145" r="72" fill="#fff0a8" opacity=".9"/>
  <circle cx="950" cy="145" r="100" fill="#fff5bd" opacity=".2"/>
  <path d="M0 450 Q180 380 350 450 T700 435 T1200 445 V570 H0Z" fill="#a7d3cf" opacity=".7"/>
  <path d="M0 490 Q190 415 380 490 T760 475 T1200 485 V570 H0Z" fill="#79b3af" opacity=".75"/>
  <path d="M0 530 Q250 470 500 530 T1000 515 T1200 525 V580 H0Z" fill="#5f9295" opacity=".75"/>
  <path d="M0 555 H1200 V800 H0Z" fill="url(#road)"/>
  <path d="M0 615 H1200" stroke="#718198" stroke-width="6" opacity=".45"/>
  <path d="M35 730 L175 730 M335 730 L475 730 M635 730 L775 730 M935 730 L1075 730" stroke="#f4df9e" stroke-width="12" stroke-linecap="round" opacity=".85"/>
  <ellipse cx="590" cy="704" rx="390" ry="28" fill="#14202d" opacity=".32" filter="url(#softShadow)"/>

  <!-- 远处飞鸟与动感线 -->
  <path d="M150 190 q24 -22 48 0 q24 -22 48 0 M250 250 q18 -16 36 0 q18 -16 36 0" fill="none" stroke="#5e91a8" stroke-width="7" stroke-linecap="round" opacity=".75"/>
  <path d="M1000 350 h105 M1035 385 h80" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".6"/>

  <!-- 自行车阴影 -->
  <ellipse cx="616" cy="682" rx="280" ry="16" fill="#121c28" opacity=".45" filter="url(#smallShadow)"/>

  <!-- 自行车 -->
  <g id="bicycle" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="430" cy="625" r="106" fill="none" stroke="#ecf3f5" stroke-width="10"/>
    <circle cx="810" cy="625" r="106" fill="none" stroke="#ecf3f5" stroke-width="10"/>
    <circle cx="430" cy="625" r="8" fill="#ecf3f5"/>
    <circle cx="810" cy="625" r="8" fill="#ecf3f5"/>
    <g stroke="#b8cbd2" stroke-width="3" opacity=".75">
      <path d="M430 625 L430 519 M430 625 L430 731 M430 625 L324 625 M430 625 L536 625 M430 625 L505 550 M430 625 L355 700"/>
      <path d="M810 625 L810 519 M810 625 L810 731 M810 625 L704 625 M810 625 L916 625 M810 625 L885 550 M810 625 L735 700"/>
    </g>
    <path d="M430 625 L550 625 L680 625 L810 625 L690 470 Z" fill="none" stroke="url(#bike)" stroke-width="16"/>
    <path d="M550 625 L690 470 L615 470 Z" fill="none" stroke="url(#bike)" stroke-width="16"/>
    <path d="M690 470 L720 425" stroke="#263849" stroke-width="13"/>
    <path d="M701 420 h70" stroke="#263849" stroke-width="13"/>
    <path d="M550 625 L505 550" stroke="#263849" stroke-width="13"/>
    <path d="M486 548 h48" stroke="#263849" stroke-width="13"/>
    <circle cx="615" cy="625" r="28" fill="none" stroke="#ffc857" stroke-width="9"/>
    <path d="M615 625 l-31 -28 M615 625 l31 28" stroke="#ffc857" stroke-width="8"/>
    <circle cx="584" cy="597" r="8" fill="#ffc857"/>
    <circle cx="646" cy="653" r="8" fill="#ffc857"/>
    <path d="M802 476 q37 -18 62 4" fill="none" stroke="#263849" stroke-width="12"/>
    <path d="M790 470 q15 -15 30 -4" fill="none" stroke="#263849" stroke-width="10"/>
  </g>

  <!-- 鹈鹕身体 -->
  <g id="pelican" stroke="#233746" stroke-width="7" stroke-linejoin="round">
    <!-- 尾羽 -->
    <path d="M570 486 q-75 -58 -112 -16 q44 14 75 56" fill="#bccbd0"/>
    <!-- 身体与胸部 -->
    <path d="M544 299 q82 -55 165 9 q45 35 30 124 q-12 70 -74 90 q-101 33 -154 -45 q-39 -58 -12 -116 q14 -31 45 -62z" fill="url(#feather)"/>
    <path d="M610 324 q45 28 61 82 q-22 5 -52 0 q-15 60 -64 78 q-43 -26 -49 -72 q3 -56 42 -84z" fill="#f5eee0" stroke="none"/>
    <!-- 翼 -->
    <path d="M594 329 q-75 34 -103 119 q20 45 73 49 q34 -18 62 -69 q25 -49 4 -99z" fill="#c3d2d6"/>
    <path d="M536 408 q22 25 51 32 M526 434 q24 23 47 27 M520 462 q22 16 40 18" fill="none" stroke="#92aab2" stroke-width="6"/>
    <!-- 颈部和头 -->
    <path d="M675 321 q-17 -61 10 -102 q32 -43 95 -21 q47 17 52 74 q4 48 -34 76 q-38 27 -80 9z" fill="url(#feather)"/>
    <!-- 头盔 -->
    <path d="M687 250 q2 -61 63 -78 q62 -14 91 40 l7 35 q-81 -27 -161 3z" fill="#4d8fd1"/>
    <path d="M684 250 q84 -39 164 -4" fill="none" stroke="#316fae" stroke-width="11"/>
    <path d="M749 173 q-2 30 15 57" fill="none" stroke="#8bc2f0" stroke-width="8" opacity=".8"/>
    <!-- 眼睛 -->
    <ellipse cx="789" cy="238" rx="10" ry="13" fill="#172632" stroke="none"/>
    <circle cx="793" cy="234" r="3.5" fill="#fff" stroke="none"/>
    <!-- 鹈鹕长喙与喉囊 -->
    <path d="M827 258 q79 -17 180 22 q-68 35 -168 28 q-38 -11 -12 -50z" fill="url(#beak)"/>
    <path d="M827 308 q71 2 148 -27 q-38 89 -125 83 q-34 -11 -23 -56z" fill="#f0a84c"/>
    <path d="M865 286 q55 3 109 -9" fill="none" stroke="#b87531" stroke-width="5"/>
    <path d="M929 278 q23 2 44 0" fill="none" stroke="#fff0a8" stroke-width="7" opacity=".6"/>
    <!-- 脚、膝与脚蹬 -->
    <path d="M613 492 q8 58 31 99" fill="none" stroke="#e7a43d" stroke-width="18"/>
    <path d="M700 493 q-6 64 -47 99" fill="none" stroke="#e7a43d" stroke-width="18"/>
    <path d="M644 590 q-23 27 -39 34 M644 590 q20 20 38 26" fill="none" stroke="#e7a43d" stroke-width="10"/>
    <path d="M653 588 q-5 39 -7 54 M653 588 q8 38 24 52" fill="none" stroke="#d88932" stroke-width="6"/>
    <!-- 翼下握把 -->
    <path d="M663 365 q51 28 82 70" fill="none" stroke="#c3d2d6" stroke-width="22"/>
    <path d="M744 435 q-15 2 -25 -11" fill="none" stroke="#e7a43d" stroke-width="13"/>
  </g>

  <!-- 前景花草 -->
  <g fill="none" stroke-linecap="round">
    <path d="M108 650 q5 -50 22 -82 M127 651 q24 -36 45 -47 M88 671 q14 -28 11 -57" stroke="#6fb47b" stroke-width="9"/>
    <circle cx="130" cy="574" r="10" fill="#f5b5c6" stroke="none"/>
    <circle cx="170" cy="604" r="9" fill="#f4d47b" stroke="none"/>
    <path d="M1060 671 q-5 -45 -25 -74 M1044 673 q24 -34 42 -40 M1090 680 q-9 -31 -3 -61" stroke="#6fb47b" stroke-width="9"/>
    <circle cx="1034" cy="594" r="10" fill="#f5b5c6" stroke="none"/>
    <circle cx="1086" cy="616" r="9" fill="#f4d47b" stroke="none"/>
  </g>

  <!-- 动态强调 -->
  <path d="M265 565 q-38 32 -56 75 M305 545 q-31 24 -48 53" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".65"/>
  <text x="72" y="95" fill="#2f5e76" font-family="system-ui, sans-serif" font-size="27" font-weight="700" letter-spacing="3">MORNING RIDE</text>
  <text x="73" y="128" fill="#477b8f" font-family="system-ui, sans-serif" font-size="16" letter-spacing="1">一只迎着晨光出发的鹈鹕</text>
</svg>
